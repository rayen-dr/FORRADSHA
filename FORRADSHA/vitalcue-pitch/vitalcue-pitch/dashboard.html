.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit;font-size:13px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cw{position:relative;overflow-x:auto}svg{width:100%;min-width:520px;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;display:none;white-space:nowrap}
.leg{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:6px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.tw{overflow-x:auto;margin-top:14px}table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}

function chart(p){const keys=SIG[tab].s,W=760,H=260,m={l:46,r:12,t:12,b:28},pts=p.points,n=pts.length;
